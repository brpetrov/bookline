<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bookline — portfolio cover</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        src: url('../bookline-web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1600px;
        height: 1200px;
        overflow: hidden;
        position: relative;
        font-family: 'Inter Variable', system-ui, sans-serif;
        color: #fff;
        background: #1e1b4b;
        -webkit-font-smoothing: antialiased;
      }

      /* Two soft blooms so the field isn't a flat block of colour. */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70rem 50rem at 8% -10%, rgba(139, 92, 246, 0.65), transparent 62%),
          radial-gradient(55rem 45rem at 100% 8%, rgba(14, 165, 233, 0.4), transparent 60%),
          linear-gradient(160deg, #312e81 0%, #1e1b4b 55%, #0f172a 100%);
      }

      .sheet {
        position: relative;
        height: 100%;
        padding: 84px 0 0 88px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
        font-size: 22px;
        font-weight: 700;
      }

      .brand span {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        margin-top: 52px;
        max-width: 21ch;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }

      h1 em {
        font-style: normal;
        color: #c7d2fe;
      }

      p.lede {
        margin-top: 26px;
        max-width: 62ch;
        font-size: 25px;
        line-height: 1.5;
        color: #c7d2fe;
      }

      ul {
        display: flex;
        gap: 10px;
        margin-top: 40px;
        list-style: none;
      }

      li {
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        font-size: 19px;
        font-weight: 500;
        color: #e0e7ff;
      }

      /* The calendar bleeds off the right and bottom edges - it reads as a window
         onto a bigger app rather than a pasted-in rectangle. */
      .window {
        position: absolute;
        top: 560px;
        left: 88px;
        width: 1760px;
        border-radius: 18px 18px 0 0;
        overflow: hidden;
        background: #f8fafc;
        box-shadow: 0 60px 120px -30px rgba(2, 6, 23, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 44px;
        padding: 0 18px;
        background: #e2e8f0;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #cbd5e1;
      }

      .url {
        margin-left: 14px;
        padding: 5px 16px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #64748b;
        font-size: 14px;
      }

      .window img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="brand">
        <span class="mark">B</span>
        <span>Bookline</span>
      </div>

      <h1>Appointment booking &amp;<br /><em>staff scheduling</em></h1>

      <p class="lede">
        Real availability from opening hours, shifts, time off and buffers — with a drag-and-drop
        week calendar that updates live.
      </p>

      <ul>
        <li>ASP.NET Core 10</li>
        <li>React 19</li>
        <li>TypeScript</li>
        <li>EF Core · SQL Server</li>
        <li>SignalR</li>
      </ul>
    </div>

    <div class="window">
      <div class="chrome">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="url">bookline.app/admin/calendar</span>
      </div>
      <img src="screenshots/01-week-calendar.png" alt="Week calendar" />
    </div>
  </body>
</html>
